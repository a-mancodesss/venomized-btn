<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4f3" />
    <meta name="description" content="A glossy, living button. Move closer, stretch the tendrils, and break the bond." />
    <title>Venomized — a sticky little interaction</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="./index.html" aria-label="Venomized home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 5C7 5 7 17 12 20C17 17 17 5 21 5C17 5 15 8 12 12C9 8 7 5 3 5Z" fill="currentColor"/></svg>
        venomized<span class="wordmark-period">.</span>
      </a>
      <div class="state" aria-hidden="true"><span class="state-dot"></span><span class="state-label">dormant</span></div>
    </header>

    <canvas class="web" aria-hidden="true"></canvas>

    <main class="stage">
      <div class="scene">
        <div class="button-anchor">
          <button class="venom-button" type="button" aria-describedby="interaction-hint">
            <span class="reflection reflection-top" aria-hidden="true"></span>
            <span class="reflection reflection-left" aria-hidden="true"></span>
            <span class="reflection reflection-right" aria-hidden="true"></span>
            <span class="button-label">let’s collaborate</span>
          </button>
        </div>
        <div class="hint" id="interaction-hint">
          <p class="hint-title">A little too attached.</p>
          <p class="hint-description">Move closer. Pull away. Feel the resistance.</p>
        </div>
      </div>
    </main>

    <div class="hand-cursor" aria-hidden="true">
      <svg viewBox="0 0 52 62" fill="none">
        <path d="M20 47C17 43 13 40 9 35C6 31 7 27 10 26C13 25 16 30 18 31L16 9C15.5 5 18 2 21 2C24 2 26 4 26 8L27 23C29 18 35 19 36 24C39 21 44 23 44 28C48 27 50 30 49 35L46 44L41 50Z" fill="#FAFAF8" stroke="#101113" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M27 23L28 33M36 24L36 33M44 28L43 35M17 35L23 38" stroke="#101113" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20 47L42 47L42 57L21 59Z" fill="#FAFAF8" stroke="#101113" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M26 51L26.5 55M32 51L32 54.5M37.5 51L37 54" stroke="#101113" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 7L20.5 19" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <footer class="footer">
      <span class="edition">An experiment in attraction <span>— 001</span></span>
      <button class="replay" type="button" aria-label="Replay the sticky button interaction">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 7A6 6 0 1 1 4 13M4 3V7H8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Replay
      </button>
    </footer>
    <p class="sr-only" role="status" aria-live="polite" id="activation-status"></p>
  </body>
</html>
